name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Run the install scripts from this commit against the latest published release
  installers:
    name: installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          CORTEX_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/cortex" --version
          # a version that doesn't exist must fail, not report success
          if CORTEX_VERSION=v0.0.0-missing CORTEX_INSTALL_DIR="$RUNNER_TEMP/bin2" sh install.sh; then
            echo "install.sh should have failed for a missing version"; exit 1
          fi
          # a release without SHA256SUMS.txt must fail too: the download can't be verified
          mirror="$RUNNER_TEMP/mirror"; mkdir -p "$mirror/download/v9.9.9"
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            cp "$RUNNER_TEMP/bin/cortex" "$mirror/download/v9.9.9/cortex-$t.tar.gz"
          done
          python3 -m http.server 18765 --bind 127.0.0.1 --directory "$mirror" & sleep 2
          if CORTEX_RELEASES_URL=http://127.0.0.1:18765 CORTEX_VERSION=v9.9.9 CORTEX_INSTALL_DIR="$RUNNER_TEMP/bin3" sh install.sh; then
            echo "install.sh should have failed without a checksum"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/bin3/cortex"
          kill %1
      - name: install.ps1 (Windows PowerShell, as with irm | iex)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:CORTEX_INSTALL_DIR = "$env:RUNNER_TEMP\cortex"
          Get-Content -Raw .\install.ps1 | Invoke-Expression
          & "$env:RUNNER_TEMP\cortex\cortex.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "cortex.exe didn't run" }
          # a version that doesn't exist must throw, not report success
          $env:CORTEX_VERSION = 'v0.0.0-missing'
          $failed = $false
          try { Get-Content -Raw .\install.ps1 | Invoke-Expression } catch { $failed = $true }
          if (-not $failed) { throw "install.ps1 should have failed for a missing version" }

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --locked: fail here if Cargo.lock is out of date (the release build would fail later)
      - run: cargo clippy --locked --all-targets -- -D clippy::correctness
      # the core's session tests and the end-to-end check below run tests/mock_server.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo test --locked
      # GitHub's macOS runners can hold back connections to a freshly started Python server
      # behind the application firewall; it's a throwaway test machine, so switch it off.
      - name: Allow local connections (macOS)
        if: runner.os == 'macOS'
        run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off || true
      - name: End-to-end against the mock server
        shell: bash
        env:
          CORTEX_HOME: ${{ runner.temp }}/cortex-home
        run: |
          python -u tests/mock_server.py 11999 > mock.log 2>&1 &
          trap 'echo "--- mock server log ---"; cat mock.log' ERR
          # wait until the server actually answers (up to 30s) instead of a fixed sleep
          for i in $(seq 1 30); do
            curl -s -o /dev/null --max-time 2 http://127.0.0.1:11999/api/tags && break
            sleep 1
          done
          curl -sS --max-time 5 http://127.0.0.1:11999/api/tags
          echo
          cargo build --locked
          BIN=target/debug/cortex
          $BIN config set base_url http://127.0.0.1:11999
          $BIN config set model mock:7b
          $BIN doctor
          out=$($BIN run -q "what is 1234 * 5678?" < /dev/null)
          echo "$out"
          echo "$out" | grep -q 7006652
          # a model that repeats its exact previous call gets "Not run again" instead of a second run
          out=$($BIN run -q "loop: what is 1234 * 5678?" < /dev/null)
          echo "$out"
          echo "$out" | grep -q "Not run again"
          # one-step install through Ollama's pull (the mock serves it); a download the user starts
          # works with the agent's network access off
          $BIN config set allow_network false
          $BIN models install qwen2.5:3b --use < /dev/null
          $BIN config | grep -q 'model = "qwen2.5:3b"'
          $BIN models | grep -q qwen2.5:3b
          out=$($BIN run -q "what is 1234 * 5678?" < /dev/null)
          echo "$out" | grep -q 7006652
          # importing a GGUF from a URL: download, upload to Ollama, create
          $BIN models import http://127.0.0.1:11999/files/model.gguf --name tiny-gguf --use < /dev/null
          $BIN models | grep -q tiny-gguf
          $BIN config | grep -q 'model = "tiny-gguf"'
          $BIN config set backend openai
          $BIN config set base_url http://127.0.0.1:11999/v1
          $BIN config set model mock-7b
          out=$($BIN run -q "what is 1234 * 5678?" < /dev/null)
          echo "$out" | grep -q 7006652
