[workspace]
members = ["crates/cortex-core"]
# plain `cargo test` / `cargo clippy` at the root cover the core too, not just the CLI
default-members = [".", "crates/cortex-core"]

[workspace.package]
version = "0.1.3"
license = "Apache-2.0"
authors = ["Ben Maples"]
repository = "https://github.com/bmap02/Cortex"
homepage = "https://github.com/bmap02/Cortex"
edition = "2024"

# only the crates both packages use; the rest stay in their own package
[workspace.dependencies]
regex = "1.13.1"
serde_json = "1.0.154"
sysinfo = "0.40.1"
toml = "1.2.0"
ureq = { version = "2", features = ["json"] }

[package]
name = "cortex"
description = "A lightweight, fully local AI agent for your terminal (Ollama or any OpenAI-compatible server)"
readme = "README.md"
keywords = ["llm", "ollama", "agent", "cli", "local-ai"]
categories = ["command-line-utilities"]
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true

[dependencies]
cortex-core = { path = "crates/cortex-core" }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
enable-ansi-support = "0.2"  # turns on ANSI colors in Windows consoles; no-op elsewhere
regex.workspace = true
rustyline = "19.0.0"
serde_json.workspace = true
sysinfo.workspace = true
terminal_size = "0.4.4"
toml.workspace = true
unicode-width = "0.2"
ureq.workspace = true
# code block highlighting; pure-Rust regex engine (no C compiler needed) and the bundled grammars/themes
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
sha2 = "0.11.1"  # checks `cortex update` downloads against the release checksums

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(windows)".dependencies]
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }  # extract the release .zip in `cortex update`
