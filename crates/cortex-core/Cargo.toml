[package]
name = "cortex-core"
description = "The Cortex agent: backends, tools, config and sessions, shared by the Cortex front-ends"
publish = false
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true

[dependencies]
enable-ansi-support = "0.2"  # turns on ANSI colors in Windows consoles; no-op elsewhere
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
ureq.workspace = true
terminal_size = "0.4.4"
unicode-width = "0.2"
# code block highlighting; pure-Rust regex engine (no C compiler needed) and the bundled grammars/themes
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
