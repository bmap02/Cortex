# Models Cortex recommends, bundled into the binary. Only tool-capable models belong here.
#
# id           Ollama model name (what `cortex models pull` downloads)
# name         what to look for in other servers (LM Studio, llama.cpp, ...)
# params_b     parameters, in billions
# quant        quantization of the Ollama default tag
# download_gb  size of the Ollama download
# memory_gb    estimated memory to run it at Cortex's default 8k context: weights plus the
#              context cache plus about 0.5 GB overhead (more for models with a large cache)

[[model]]
id = "llama3.2:1b"
name = "Llama 3.2 1B Instruct"
params_b = 1.2
quant = "Q8_0"
download_gb = 1.3
memory_gb = 2.1
tools = true

